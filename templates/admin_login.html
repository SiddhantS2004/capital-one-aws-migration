
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Credit Application Centre</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="shell" style="max-width: 440px; padding-top: 100px;">
        <section class="panel form-panel">
            <p class="eyebrow">ADMINISTRATION</p>
            <h2>Administrator login</h2>
            <p class="subheading">Sign in to access the application management dashboard.</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <div class="alert {{ category }}">{{ message }}</div>
                {% endfor %}
            {% endwith %}

            <form method="POST" action="{{ url_for('admin_login') }}">
                <label>
                    Admin password
                    <input
                        type="password"
                        name="password"
                        placeholder="Enter admin password"
                        required
                        autofocus
                    >
                </label>

                <div class="form-foot">
                    <a href="{{ url_for('index') }}">Back to homepage</a>
                    <button type="submit">Sign in →</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
